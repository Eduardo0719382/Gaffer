# Publica una versión nueva cuando se sube un tag vX.Y.Z.
# Compila Windows, macOS, Linux y Android, y crea el GitHub Release con todos los archivos.
# Las apps instaladas buscan ese Release para actualizarse.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Versión desde el tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm run build
      - name: Empaquetar
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/*.AppImage
            release/latest*.yml

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Versión desde el tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Sin llave, solo comprobar que compila (no se publica)
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: |
          echo "::warning::No hay llave de firma Android en GitHub Secrets; esta versión sale sin APK."
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Compilar APK firmado
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.p12
          V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$V"
          export VERSION_NAME="$V" VERSION_CODE=$((MA * 10000 + MI * 100 + PA))
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../Gaffer-$V.apk"
          rm app/release.p12
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: release-android
          path: Gaffer-*.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true
